# Builds the app's Docker image (Dockerfile at the root: engine + web in one container) and tests it within the
# memory of Render's free plan (render.yaml; Render deploys from the repository itself). Optionally deploys it to a
# Hugging Face Space, which needs a Hugging Face PRO subscription for Docker Spaces.
#
# Repository secrets:
#   HF_TOKEN                          optional: a Hugging Face write token; without it, this workflow only tests
#   SEC_USER_AGENT, FINNHUB_API_KEY   live data (your "Name email" for the SEC, and a Finnhub key); without them
#                                     the app runs on the synthetic market
#   TIINGO_API_KEY, FRED_API_KEY, FMP_API_KEY   optional: fuller price history, live rates, the starter data tier
# Repository variables (optional): HF_SPACE (owner/name, default <you>/candor), HF_SPACE_PRIVATE ("false" = public).
name: Deploy app

on:
  push:
    branches: [main, claude/problem-solution-brainstorm-us4vrq]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t candor .

      # Both tests run within 512 MB, the memory of Render's free plan.
      - name: Test the app on the synthetic market
        run: |
          docker run -d --name synthetic --memory 512m --memory-swap 512m -p 7860:7860 candor
          python3 deploy/smoke.py http://127.0.0.1:7860 ZZTEC ZZBNK --synthetic || { docker logs synthetic | tail -80; exit 1; }
          deploy/memory.sh synthetic
          docker rm -f synthetic

      # Diagnostic: shows what each section gets from the live sources, and how long a first report takes on a
      # tenth of a CPU, as on Render's free plan. It doesn't block the deploy, since a provider's gap shows as
      # "missing" on the page rather than breaking it.
      - name: Test the app on live data
        continue-on-error: true
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: |
          if [ -z "$SEC_USER_AGENT" ] || [ -z "$FINNHUB_API_KEY$TIINGO_API_KEY$FMP_API_KEY" ]; then
            echo "::notice::No live-data secrets (SEC_USER_AGENT and FINNHUB_API_KEY); skipping the live test."
            exit 0
          fi
          docker run -d --name live --memory 512m --memory-swap 512m --cpus 0.1 -p 7861:7860 -e SEC_USER_AGENT \
            -e FINNHUB_API_KEY -e TIINGO_API_KEY -e FRED_API_KEY -e FMP_API_KEY candor
          status=0
          python3 deploy/smoke.py http://127.0.0.1:7861 AAPL JPM || status=$?
          deploy/memory.sh live || status=1
          echo "--- engine log (last lines) ---"
          docker logs live 2>&1 | grep -v " 200 OK" | tail -120
          exit $status

  deploy:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Deploy to the Hugging Face Space (optional, needs Hugging Face PRO)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
          HF_SPACE_PRIVATE: ${{ vars.HF_SPACE_PRIVATE }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "No HF_TOKEN secret: not deploying to Hugging Face (Render deploys from the repository; see README)."
            exit 0
          fi
          pip install --quiet huggingface_hub==1.33.0
          python deploy/hf_space.py

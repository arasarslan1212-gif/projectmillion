# Render Blueprint (https://render.com/docs/blueprint-spec): New → Blueprint → pick this repository (README:
# "Deploy the live app"). Free plan: 512 MB and a tenth of a CPU, asleep after 15 idle minutes; the app fits in the
# memory (CI tests it within 512 MB), and "starter" makes it faster.
services:
  - type: web
    name: candor
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/engine/health
    envVars:
      - key: SEC_USER_AGENT # your "Name email", required by the SEC
        sync: false
      - key: FINNHUB_API_KEY # quotes, news, analyst consensus, earnings
        sync: false
      - key: TIINGO_API_KEY # daily price history (Finnhub's free plan has none)
        sync: false
      - key: FRED_API_KEY # optional: live interest rates
        sync: false

    restatement: {pillar: earnings_quality, cap: 30, overall: 6}
    beneish_m: {pillar: earnings_quality, cap: 40, overall: 3}
    late_filing: {pillar: earnings_quality, cap: 50, overall: 3}
    auditor_change: {pillar: earnings_quality, cap: 60, overall: 2}
    altman_z: {pillar: financial_health, cap: 35, overall: 3}
    cash_runway: {pillar: financial_health, cap: 30, overall: 4}
    debt_wall: {pillar: financial_health, cap: 40, overall: 3}
    interest_coverage: {pillar: financial_health, cap: 40, overall: 2}
    dilution: {pillar: earnings_quality, cap: 60, overall: 2}
    customer_concentration: {pillar: risk, cap: 65, overall: 1}
    accruals: {pillar: earnings_quality, cap: 60, overall: 1}


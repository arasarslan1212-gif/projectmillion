    ev_sales_vs_history: {label: "EV/Sales vs. own 5-year history (z)", unit: ratio, direction: lower, anchors: [2.0, -2.0]}
    p_ffo_vs_history: {label: "P/FFO vs. own 5-year history (z)", unit: ratio, direction: lower, anchors: [2.0, -2.0]}

  debt_wall_share: 0.20
  debt_wall_share_high: 0.35

# ---------------------------------------------------------------------------------------
# Valuation engine (see DECISIONS D-002, D-003)
# ---------------------------------------------------------------------------------------

# ---------------------------------------------------------------------------------------
# Wall Street analysts: who to trust. Every call (a target and/or rating on a date) is scored
# only once its horizon has passed, using prices up to the report date (point-in-time).
analysts:
  stale_months: 6                 # targets older than this are greyed out and excluded from consensus
  # Targets more than this factor above or below the median active target are treated as likely data
  # errors (e.g. an unadjusted split): flagged and excluded from both consensus figures.
  outlier_factor: 3.0
  rating_stale_months: 12         # ratings older than this drop out of the rating distribution
  grade_join_days: 3              # a firm grade within ± this many days supplies the rating for a target
  horizons: {3m: 63, 6m: 126, 12m: 252}   # trading days
  # When a call has no rating, its direction comes from the target: ≥ +10% implies Buy, ≤ −10% Sell.
  implied_direction_threshold: 0.10
  recency_half_life_years: 3.0
  # Bayesian shrinkage: prior strength in (recency-weighted) calls. A metric estimated from n calls
  # is (n × own + k × prior) ÷ (n + k). Ticker scope shrinks toward the analyst's sector scope,
  # sector toward the analyst's all-stock scope, and that toward the average analyst.
  shrinkage_k: 15
  score_weights: {hit_rate: 0.30, accuracy: 0.25, directional: 0.35, bias: 0.10}
  directional_horizon_weights: {3m: 0.25, 6m: 0.35, 12m: 0.40}
  anchors:                        # [value scoring 0, value scoring 100]
    hit_rate: [0.30, 0.80]
    mape: [0.45, 0.10]
    directional: [-0.08, 0.08]
    optimism_bias: [0.25, 0.0]
  # Trusted consensus: each active target weighted by (Trust Score ÷ 100) ^ gamma.
  trusted_weight_gamma: 2.0
  min_scored_calls_label: 5       # below this, the table shows "limited history"
  # Analysts' cross-stock history comes from the local database. Every report ingests the subject
  # and its peers; the nightly job ingests this universe as well.
  universe: index_members
  synthetic_universe: [ZZTEC, ZZBNK, ZZREI, ZZGRO, ZZUTL, ZZSML]
  history_months: 24              # rating distribution and target-revision charts
  # Cards are ordered with these firms first, then any others covering the stock.
  major_firms: [Goldman Sachs, Morgan Stanley, JPMorgan, J.P. Morgan, Bank of America, BofA Securities, Citigroup,
                Citi, Wells Fargo, UBS, Barclays, Deutsche Bank]



# ---------------------------------------------------------------------------------------
# Earnings, dividends, ownership.
earnings:
  quarters: 12                    # history shown
  drift_days: 20                  # post-earnings drift window (trading days)
  revision_windows: [7, 30, 60, 90]
dividends:
  # Dividend safety score (0–100): weighted components, each scored linearly between anchors
  # [value scoring 0, value scoring 100]. REITs use FFO instead of net income for the earnings payout.
  safety_weights: {earnings_payout: 0.30, fcf_payout: 0.30, leverage: 0.20, stability: 0.10, streak: 0.10}
  anchors:
    earnings_payout: [1.0, 0.4]
    fcf_payout: [1.2, 0.5]
    leverage: [5.0, 1.0]          # net debt ÷ EBITDA (not used for banks and insurers)
    stability: [0.5, 1.0]         # share of the last 8 years with positive EPS
    streak: [0, 10]               # consecutive years of dividend increases
  # Capital-intensive profiles fund capex with debt by design: judge utilities on earnings payout rather than
  # free cash flow, and use leverage anchors that match their normal capital structure.
  profile_anchors:
    utility: {leverage: [7.0, 3.5], earnings_payout: [1.0, 0.6]}
    reit: {leverage: [8.0, 4.0], earnings_payout: [1.05, 0.65], fcf_payout: [1.3, 0.8]}
  profile_skip:
    utility: [fcf_payout]
  levels: [[70, "Safe"], [45, "Moderate"], [0, "At risk"]]
ownership:
  insider_lookback_months: 24
  cluster_window_days: 30         # cluster buying: at least this many distinct insiders buying
  cluster_min_insiders: 3         #   on the open market within the window
# ---------------------------------------------------------------------------------------
# News and sentiment. Stories are clustered, classified (LLM, else keyword rules), and aggregated.
news:
  cluster_window_hours: 48        # items this close in time with similar headlines are one story
  cluster_similarity: 0.5         # Jaccard similarity of normalized headline words
  max_clusters_llm: 80            # the most recent stories get model classification; older ones keyword rules
  llm_batch_size: 15              # stories per classification request
  sentiment_half_life_days: 7     # decay of the daily sentiment index
  min_series_weight: 0.3          # below this decayed weight a day shows no index value
  materiality_weights: {low: 0.4, medium: 1.0, high: 2.0}
  # Source reliability (0–1) scales each story's weight. Wire services and major financial press highest;
  # company press releases are primary but promotional; opinion and aggregator sites lowest.
  reliability:
    default: 0.6
    sources:
      Reuters: 1.0
      Associated Press: 1.0
      Bloomberg: 1.0
      Dow Jones: 1.0
      The Wall Street Journal: 1.0
      Financial Times: 0.95
      Barron's: 0.9
      CNBC: 0.85
      MarketWatch: 0.8
      Investor's Business Daily: 0.75
      Business Wire: 0.75
      PR Newswire: 0.75
      GlobeNewswire: 0.75
      Benzinga: 0.7
      Yahoo: 0.7
      TheStreet: 0.6
      Zacks: 0.55
      Seeking Alpha: 0.55
      Motley Fool: 0.5
      InvestorPlace: 0.45
    synthetic:
      Synthetic Wire: 1.0
      Placeholder Financial Times: 0.9
      Example Business News: 0.8
      Sample Markets Daily: 0.6

# ---------------------------------------------------------------------------------------
# LLM layer. Model IDs come from FAST_MODEL / REASONING_MODEL; the per-report token budget from
# LLM_REPORT_TOKEN_BUDGET. Prices (USD per million tokens, input/output) are used for cost logs only.
llm:
  news_max_tokens: 6000
  prompt_versions: {news_batch: news-v1, news_item: news-v1, news_digest: digest-v1, explain_narrative: explain-v1}
  pricing_per_mtok:
    default: [4.0, 20.0]
    claude-haiku-4-5-20251001: [1.0, 5.0]
    claude-haiku-4-5: [1.0, 5.0]
    claude-sonnet-5: [2.0, 10.0]
    claude-sonnet-5-5: [2.0, 10.0]
    claude-opus-5-5: [4.0, 20.0]

valuation:
  horizon_months: 12
  # Share of the log-gap between price and intrinsic value assumed to close within 12 months.
  convergence_12m: 0.4
  wacc:
    equity_risk_premium: 0.05       # round, conservative figure within the commonly used 4–6% range
    risk_free_series: DGS10         # FRED 10-year Treasury yield
    risk_free_fallback: 0.04        # used (and labeled) only if FRED is unavailable
    beta_years: 3
    beta_fallback: 1.0
    marginal_tax_rate: 0.21
    cost_of_debt_spread_min: 0.005
    cost_of_debt_spread_max: 0.08
    cost_of_debt_spread_fallback: 0.02
    wacc_bounds: [0.05, 0.15]
  dcf:
    years: 10
    terminal_growth: 0.025
    terminal_growth_cap: 0.03       # never above long-run nominal growth
    min_wacc_minus_g: 0.02
    mid_year: true
    near_term_growth_bounds: [-0.10, 0.40]
    # terminal reinvestment = g / ROIC_terminal, with ROIC_terminal = WACC + this spread
    terminal_roic_spread: 0.02
    margin_convergence_years: 5
    tax_rate_bounds: [0.10, 0.30]
    scenarios:
      bear: {growth_shift: -0.05, growth_mult: 0.6, margin_shift: -0.03, wacc_shift: 0.01}
      base: {growth_shift: 0.0, growth_mult: 1.0, margin_shift: 0.0, wacc_shift: 0.0}
      bull: {growth_shift: 0.03, growth_mult: 1.3, margin_shift: 0.02, wacc_shift: -0.005}
    scenario_probabilities: {bear: 0.25, base: 0.5, bull: 0.25}
  monte_carlo:
    draws: 10000
    seed: 7                          # combined with ticker and date so results are reproducible
    growth_sigma_bounds: [0.02, 0.15]
    margin_sigma_bounds: [0.01, 0.06]
    wacc_sigma: 0.01
    terminal_growth_sigma: 0.005
    growth_margin_correlation: 0.3
    path_days: 252
    path_draws: 4000
  relative:
    growth_adjustment: 1.0           # multiple scales by 1 + k × (growth − peer median growth)
    quality_adjustment: 0.3          # and by 1 + k × (profitability pillar − 50)/100
    adjustment_bounds: [0.6, 1.6]
    min_peers: 3
    history_years: 5
  ddm:
    max_growth: 0.06
  excess_return:
    years: 10
  # Method weights by profile before applicability and accuracy scaling.
  methods:
    general: {dcf: 0.40, relative_peers: 0.25, relative_history: 0.20, analyst_consensus: 0.15}
    software: {dcf: 0.40, relative_peers: 0.25, relative_history: 0.20, analyst_consensus: 0.15}
    retail: {dcf: 0.40, relative_peers: 0.25, relative_history: 0.20, analyst_consensus: 0.15}
    energy: {dcf: 0.35, relative_peers: 0.30, relative_history: 0.20, analyst_consensus: 0.15}
    biotech: {dcf: 0.35, relative_peers: 0.30, relative_history: 0.20, analyst_consensus: 0.15}
    bank: {excess_return: 0.30, pb_roe_regression: 0.25, relative_peers: 0.15, relative_history: 0.15, analyst_consensus: 0.15}
    insurer: {pb_roe_regression: 0.35, relative_peers: 0.25, relative_history: 0.25, analyst_consensus: 0.15}
    financial_other: {pb_roe_regression: 0.35, relative_peers: 0.25, relative_history: 0.25, analyst_consensus: 0.15}
    reit: {p_ffo_history: 0.30, p_ffo_peers: 0.20, dcf: 0.20, relative_peers: 0.15, analyst_consensus: 0.15}
    utility: {ddm: 0.30, dcf: 0.25, relative_peers: 0.15, relative_history: 0.15, analyst_consensus: 0.15}
    growth_unprofitable: {dcf: 0.35, ev_sales_regression: 0.30, relative_history: 0.20, analyst_consensus: 0.15}
    biotech_pipeline: {ev_sales_regression: 0.40, relative_history: 0.30, analyst_consensus: 0.30}
  analyst_consensus_default_included: true
  range:
    z80: 1.2816
    # P10–P90 widens as confidence falls: σ × (1 + k × (1 − confidence/100)).
    confidence_widening: 0.6
  sanity:
    max_move: 1.0
    max_terminal_share: 0.75
    stale_filing_days: 150
    stale_price_days: 5

confidence:
  weights: {agreement: 0.22, data: 0.14, predictability: 0.20, volatility: 0.16, analyst_dispersion: 0.10, calibration: 0.18}
  levels: [[70, "High"], [40, "Medium"], [0, "Low"]]
  # Components are mapped linearly between [value scoring 0, value scoring 100].
  anchors:
    method_dispersion: [0.60, 0.05]      # weighted std of log method values
    growth_volatility: [0.25, 0.02]      # std of annual revenue growth
    realized_volatility: [0.80, 0.15]
    analyst_dispersion: [1.0, 0.15]      # (high − low) / mean of active targets
    calibration_error: [0.30, 0.0]       # |P10–P90 coverage − 0.80| in the track record
  profile_caps: {biotech_pipeline: 35, growth_unprofitable: 65}
  missing_component_score: 40            # neutral-to-cautious score when a component has no data

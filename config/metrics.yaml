# Metric definitions: the single source for tooltips, the glossary and the Methodology page.
# Each entry: label, definition (analyst wording), formula, plain (plain-English), optional example.

price:
  label: Price
  definition: Last traded price, or the last daily close when no intraday quote is configured.
  plain: What one share last cost.
change:
  label: Daily change
  definition: Price change versus the previous trading day's close.
  formula: price − previous close
change_pct:
  label: Daily change %
  definition: Percentage price change versus the previous close.
  formula: price ÷ previous close − 1
after_hours:
  label: After-hours price
  definition: Last trade outside regular hours. Requires an extended-hours quote feed.
market_cap:
  label: Market capitalization
  definition: Total value of all common shares at the current price.
  formula: price × shares outstanding
  plain: What the whole company would cost to buy at today's share price.
  example: 1 billion shares at $50 = $50 billion.
enterprise_value:
  label: Enterprise value
  definition: Value of the operating business to all capital providers.
  formula: market cap + total debt − cash & short-term investments + noncontrolling interests
  plain: Market cap plus the debt you'd take on, minus the cash you'd get.
shares_outstanding:
  label: Shares outstanding
  definition: Common shares outstanding from the latest filing's cover page, converted to current share units for any later splits.
low_52w:
  label: 52-week low
  definition: Lowest price over the past 52 weeks (split-adjusted).
high_52w:
  label: 52-week high
  definition: Highest price over the past 52 weeks (split-adjusted).
pos_52w:
  label: Position in 52-week range
  definition: Where the price sits between the 52-week low (0%) and high (100%).
  formula: (price − low) ÷ (high − low)
volume:
  label: Volume
  definition: Shares traded in the latest session.
avg_volume:
  label: Average volume (3 months)
  definition: Mean daily shares traded over the last 63 sessions.
volume_ratio:
  label: Volume vs. average
  definition: Latest volume relative to the 3-month average; above 1× means unusually active trading.
  formula: volume ÷ average volume
pe_ttm:
  label: P/E (trailing twelve months)
  definition: Price relative to diluted earnings per share over the last four reported quarters. Not meaningful when EPS is negative.
  formula: price ÷ TTM diluted EPS
  plain: How many years of current profits you pay for with today's price.
  example: A $100 stock earning $5 a share has a P/E of 20.
ev_ebitda_ttm:
  label: EV/EBITDA (trailing)
  definition: Enterprise value relative to trailing operating earnings before depreciation and amortization. Not used for banks and insurers.
  formula: enterprise value ÷ TTM EBITDA
dividend_yield:
  label: Dividend yield (trailing)
  definition: Dividends paid per share over the last 12 months (by ex-date) relative to price.
  formula: trailing 12-month dividends per share ÷ price
beta:
  label: Beta
  definition: Sensitivity of weekly returns to the market (SPY as S&P 500 proxy) over 3 years, Blume-adjusted toward 1 because raw betas tend to revert.
  formula: 0.67 × OLS beta + 0.33
  plain: How much the stock tends to move when the market moves 1%.

# ---- overview -------------------------------------------------------------------------
hq:
  label: Business address
  definition: Business address city and state from SEC submissions.
ipo_date:
  label: IPO / listing date
  definition: First trading date reported by the data provider.
founded:
  label: Founded
  definition: Founding date. Not available from SEC data or the configured providers.
employees:
  label: Employees
  definition: Full-time employees as reported in filings (dei:EntityNumberOfEmployees) or by the provider.
employee_growth:
  label: Employee growth
  definition: Change in reported headcount versus the prior year.
ceo:
  label: CEO
  definition: Current chief executive per the provider's key-executives data.
ceo_tenure:
  label: CEO tenure
  definition: Years since the CEO took the role, when the start year is provided.
fiscal_year_end:
  label: Fiscal year end
  definition: Month/day the company's fiscal year ends (SEC submissions).
float_shares:
  label: Float
  definition: Shares available to public investors (excludes closely held and restricted shares).
float_pct:
  label: Float % of shares
  definition: Float as a share of shares outstanding.
insider_pct:
  label: Insider ownership (Form 4 reporters)
  definition: Holdings last reported on Form 4 by insiders who traded in the lookback window, as a share of shares outstanding. Understates total insider ownership.
institutional_pct:
  label: Institutional ownership (top holders)
  definition: Combined stake of the largest 13F filers returned by the provider.
index_membership:
  label: Index membership
  definition: Membership in the S&P 500, when licensed constituent data is configured.

# ---- fundamentals -----------------------------------------------------------------------
cagr:
  label: Compound annual growth rate
  definition: Annualized growth between the first and last fiscal year of the window. Undefined when either end is zero or negative.
  formula: (last ÷ first)^(1/years) − 1
  plain: The steady yearly growth rate that would get you from the first value to the last.
yoy_growth:
  label: Year-over-year growth
  definition: Change versus the same period a year earlier. Uses the absolute prior value, so a smaller loss counts as an improvement.
  formula: (current − prior) ÷ |prior|
gross_margin:
  label: Gross margin
  definition: Share of revenue left after the direct cost of goods and services.
  formula: gross profit ÷ revenue
operating_margin:
  label: Operating margin
  definition: Share of revenue left after operating expenses (including stock-based compensation).
  formula: operating income ÷ revenue
net_margin:
  label: Net margin
  formula: net income ÷ revenue
  definition: Share of revenue that ends up as net income.
fcf_margin:
  label: FCF margin
  formula: (operating cash flow − capex) ÷ revenue
  definition: Share of revenue converted into free cash flow.
roe:
  label: Return on equity
  definition: Net income relative to average shareholders' equity. Not meaningful when equity is negative.
  formula: net income ÷ average equity
roic:
  label: Return on invested capital
  definition: After-tax operating profit relative to average invested capital (equity + debt − cash). Shown as not meaningful for banks and insurers.
  formula: EBIT × (1 − tax rate) ÷ average (equity + debt − cash)
  plain: How much profit the business earns on the money invested in it.
rotce:
  label: Return on tangible common equity
  definition: Net income relative to average equity excluding goodwill and intangibles; the key profitability metric for banks.
  formula: net income ÷ average (equity − goodwill − intangibles)
interest_coverage:
  label: Interest coverage
  definition: How many times operating profit covers interest expense.
  formula: EBIT ÷ interest expense
fcf_conversion:
  label: FCF conversion
  definition: Free cash flow relative to net income; above 100% means earnings are backed by cash.
  formula: free cash flow ÷ net income
sbc_pct_revenue:
  label: Stock comp % of revenue
  definition: Stock-based compensation expense relative to revenue. It is a real cost that dilutes shareholders.
  formula: stock-based compensation ÷ revenue
fcf_after_sbc:
  label: FCF after stock comp
  definition: Free cash flow minus stock-based compensation, treating share-based pay as the cash-equivalent cost it is.
  formula: operating cash flow − capex − stock-based compensation
capex_intensity:
  label: Capex intensity
  definition: Capital expenditures relative to revenue.
  formula: capex ÷ revenue
nwc_pct_revenue:
  label: Working capital % of revenue
  definition: Current assets minus current liabilities, relative to annual revenue.
dilution_3y:
  label: Share count change (3y)
  definition: Compound annual change in diluted weighted-average shares. Positive means dilution; negative means net buybacks.
nim:
  label: Net interest margin
  definition: Net interest income relative to average total assets (a proxy, because earning-asset data is not standardized in XBRL).
  formula: net interest income ÷ average total assets
efficiency_ratio:
  label: Efficiency ratio
  definition: Bank operating costs relative to revenue; lower is better.
  formula: noninterest expense ÷ (net interest income + noninterest income)
loan_to_deposit:
  label: Loans / deposits
  definition: Loans funded per dollar of deposits.
loan_growth:
  label: Loan growth
  definition: Change in net loans versus a year earlier.
deposit_growth:
  label: Deposit growth
  definition: Change in deposits versus a year earlier.
cet1:
  label: CET1 ratio
  definition: Common equity tier 1 capital relative to risk-weighted assets. Reported in regulatory filings, not in standardized XBRL company facts.
npl:
  label: Non-performing loans
  definition: Loans on non-accrual or 90+ days past due. Not standardized in XBRL company facts.
combined_ratio:
  label: Combined ratio
  definition: Insurance losses plus underwriting expenses relative to premiums earned; below 100% means an underwriting profit.
  formula: (losses + underwriting expenses) ÷ premiums earned
premium_growth:
  label: Premium growth
  definition: Change in premiums earned versus the prior year.
ffo:
  label: Funds from operations
  definition: NAREIT-style REIT earnings built from tagged items.
  formula: net income + real-estate depreciation & amortization − gains on property sales
ffo_per_share:
  label: FFO per share
  formula: FFO ÷ diluted shares
  definition: FFO per diluted share.
affo:
  label: Adjusted FFO (approx.)
  definition: FFO minus capital improvements. Straight-line rent and other adjustments are not standardized, so this is an approximation.
affo_per_share:
  label: AFFO per share
  definition: AFFO per diluted share.
  formula: AFFO ÷ diluted shares
affo_payout:
  label: Dividends / AFFO
  definition: Dividends paid relative to AFFO; above 100% means the dividend exceeds recurring cash earnings.
occupancy:
  label: Occupancy
  definition: Share of leasable space occupied. Disclosed in text, not standardized XBRL.
rule_of_40:
  label: Rule of 40
  definition: Revenue growth plus FCF margin. Software companies at or above 40% are generally considered to balance growth and profitability well.
  formula: revenue growth + FCF margin
nrr:
  label: Net revenue retention
  definition: Revenue from existing customers now versus a year ago. Disclosed by some software companies in text only.
dio:
  label: Days inventory outstanding
  formula: average inventory ÷ (cost of revenue ÷ 365)
  definition: How many days of cost of sales are held as inventory.
ccc:
  label: Cash conversion cycle
  definition: Days between paying suppliers and collecting from customers.
  formula: DSO + DIO − DPO
same_store_sales:
  label: Same-store sales
  definition: Sales growth at stores open over a year. Company-specific disclosure; not in XBRL facts.
production:
  label: Production volumes
  definition: Oil and gas production. Company-specific disclosure; not in XBRL facts.
breakeven:
  label: Breakeven price
  definition: Commodity price needed to fund spending. Company-specific disclosure.
rate_base_growth:
  label: PP&E growth (rate-base proxy)
  definition: Growth in net property, plant and equipment, used as a proxy for the regulated rate base that drives utility earnings.
capex_to_dna:
  label: Capex / depreciation
  definition: Capital spending relative to depreciation; above 1× means the asset base is growing.

# ---- risk ------------------------------------------------------------------------------
volatility_1y:
  label: Realized volatility (1 year)
  definition: Annualized standard deviation of daily log returns over the past year.
  formula: stdev(daily log returns) × √252
  plain: How much the price typically swings over a year.
downside_deviation:
  label: Downside deviation
  definition: Like volatility, but counting only down days, annualized.
max_drawdown_3y:
  label: Max drawdown (3 years)
  definition: Largest peak-to-trough fall in total-return price over three years.
  plain: The worst loss someone who bought at a peak would have seen.
max_drawdown_all:
  label: Max drawdown (full history)
  definition: Largest peak-to-trough fall over the full price history loaded.
current_drawdown:
  label: Current drawdown
  definition: How far the price is below its previous all-time high in the loaded history.
var_95:
  label: 1-day value at risk (95%)
  definition: Historical one-day loss exceeded on about 5% of days in the past year.
  formula: −5th percentile of daily returns (1 year)
corr_market:
  label: Correlation with the market
  definition: Correlation of daily log returns with the market benchmark over one year.
corr_sector:
  label: Correlation with the sector
  definition: Correlation of daily log returns with the sector ETF proxy over one year.
avg_dollar_volume:
  label: Average daily dollar volume
  definition: Average of price × volume over the last 63 sessions; a liquidity measure.

# ---- Valuation (M4) ----
target_p50:
  label: App 12-month target (P50)
  definition: >-
    Median of the app's 12-month price distribution. Each valuation method's long-term value is converted to a
    12-month figure by assuming the price earns its cost of equity (net of dividend yield) and closes a fixed share
    of the gap to that value within a year; the method targets are then blended in log space with weights
    proportional to profile weight × applicability × measured accuracy.
  formula: "exp(Σ wₘ · [ln P₀ + ln(1 + kₑ − dy) + λ · ln(Vₘ ÷ P₀)])"
  plain: The middle of the range where the model thinks the price could be in a year. A model estimate, not a promise.
  example: "Price $100, intrinsic value $130, cost of equity 9%, λ = 0.4: 100 × 1.09 × 1.3^0.4 ≈ $120."
target_p10:
  label: App 12-month target (P10)
  definition: >-
    10th percentile of the app's 12-month lognormal distribution: the model gives a 10% chance of the price
    finishing below this level.
  formula: "P50 × exp(−1.2816 × σ_total)"
  plain: The low end of the model's 80% range.
target_p90:
  label: App 12-month target (P90)
  definition: >-
    90th percentile of the app's 12-month lognormal distribution: the model gives a 10% chance of the price
    finishing above this level.
  formula: "P50 × exp(1.2816 × σ_total)"
  plain: The high end of the model's 80% range.
implied_return:
  label: Implied return to P50
  definition: Percentage difference between the app's median 12-month target and today's price (excludes dividends).
  formula: P50 ÷ price − 1
  plain: How far the model's middle estimate is from today's price.
expected_return:
  label: Expected return (mean)
  definition: >-
    Mean of the lognormal 12-month distribution relative to today's price. Higher than the median return because
    a lognormal distribution is skewed to the right.
  formula: "P50 × exp(σ_total² ÷ 2) ÷ price − 1"
  plain: The average outcome across all the model's scenarios, which is pulled up a little by the big-win cases.
prob_up:
  label: Probability price is higher in 12 months
  definition: >-
    Model probability that the price in 12 months exceeds today's price, from the lognormal distribution. Calibrated
    against realized outcomes once the track record has enough history.
  formula: "Φ(ln(P50 ÷ price) ÷ σ_total)"
  plain: The model's odds that the stock is up a year from now. 50% means a coin flip.
prob_drawdown_20:
  label: Probability of a ≥20% drawdown
  definition: >-
    Share of simulated daily price paths (market volatility, drift toward the P50) that fall at least 20% below their
    running peak at some point during the next 12 months, even if they recover by the end.
  formula: "share of paths with min(Pₜ ÷ max₍ₛ≤ₜ₎ Pₛ) ≤ 0.8"
  plain: The chance of a painful 20% drop along the way, based on how much this stock usually moves.
intrinsic_value:
  label: Intrinsic value (long-term)
  definition: >-
    Log-weighted blend of the valuation methods' per-share values (DCF, relative multiples, sector models). This is a
    long-term fair-value estimate, not a 12-month target; prices can stay away from it for years.
  formula: "exp(Σ wₘ · ln Vₘ)"
  plain: What the model thinks the business is worth per share over the long run.
dcf_value:
  label: DCF value per share
  definition: >-
    Free cash flow to the firm projected for 10 years (growth fading to the terminal rate, margin converging to a
    target), discounted at WACC with mid-year convention; terminal value uses reinvestment = g ÷ (WACC + spread).
    Stock-based compensation is treated as a real expense. Equity = EV − debt + cash − minorities − pension deficit.
  formula: "(Σ FCFFₜ ÷ (1+WACC)^(t−0.5) + TV ÷ (1+WACC)^10 − net debt − minorities − pension) ÷ diluted shares"
  plain: What the company's future cash flows are worth today, per share.
wacc:
  label: WACC
  definition: >-
    Weighted average cost of capital: the blended return required by shareholders and lenders. Cost of equity from
    CAPM (FRED 10-year Treasury + Blume-adjusted beta × equity risk premium); cost of debt from interest expense ÷
    average debt, bounded; book debt weight as a proxy for market value.
  formula: "E/(D+E) × kₑ + D/(D+E) × k_d × (1 − t)"
  plain: The yearly return investors and lenders expect for funding this company. Higher means future cash is worth less today.
cost_of_equity:
  label: Cost of equity
  definition: Return shareholders require, from the capital asset pricing model with a Blume-adjusted beta.
  formula: "risk-free + β_adj × equity risk premium; β_adj = 0.67 × β_raw + 0.33"
  plain: The yearly return shareholders expect for owning this stock given how much it moves with the market.
confidence:
  label: Confidence
  definition: >-
    0–100 score for how much to trust the app's target: agreement between methods, data completeness,
    predictability of results, volatility, analyst dispersion and past calibration for similar stocks, weighted as
    in the engine config and capped for some profiles (pre-revenue biotech, unprofitable growth).
  formula: "Σ wᵢ × componentᵢ, capped by profile; High ≥ 70, Medium ≥ 40, Low < 40"
  plain: How sure the model is. Low confidence means a wide range and a target you should lean on less.

# ---- Analysts (M5) ----
consensus_all:
  label: All-analyst consensus target
  definition: >-
    Plain average of the latest price target from every analyst (or firm, when analysts are not named) whose
    target is no older than the stale cutoff (default 6 months). Older targets are excluded.
  formula: mean of active targets
  plain: The average target of analysts who have updated their view recently.
consensus_median:
  label: Median analyst target
  definition: Median of the active (non-stale) analyst targets; less sensitive to one extreme target than the average.
  formula: median of active targets
consensus_trusted:
  label: Trusted consensus target
  definition: >-
    Average of the active targets weighted by each analyst's Trust Score raised to a power (default 2), so analysts
    with better scored records count more. Analysts without a scored record get the average analyst's score.
  formula: "Σ (Trust Score ÷ 100)^γ × target ÷ Σ (Trust Score ÷ 100)^γ"
  plain: The analyst average, tilted toward the analysts whose past targets held up best.
upside_consensus_all:
  label: Upside to all-analyst consensus
  definition: Percentage difference between the all-analyst consensus target and today's price.
  formula: consensus ÷ price − 1
upside_trusted_consensus:
  label: Upside to trusted consensus
  definition: Percentage difference between the trusted (Trust Score-weighted) consensus target and today's price.
  formula: trusted consensus ÷ price − 1
  plain: How far the better-track-record analysts think the price could move.
trust_weighted_rating:
  label: Trust-weighted analyst rating
  definition: >-
    Average of current ratings mapped to +1 (Buy and equivalents), 0 (Hold) and −1 (Sell), weighted like the trusted
    consensus. Labels: ≥ 0.5 Buy, ≥ 0.15 Moderate buy, > −0.15 Hold, > −0.5 Moderate sell, otherwise Sell.
  formula: "Σ wᵢ × ratingᵢ ÷ Σ wᵢ, rating ∈ {−1, 0, +1}"
  plain: Where analysts lean overall, counting better analysts more. This is their view, not the app's.
average_rating:
  label: Average analyst rating
  definition: Unweighted average of current ratings mapped to +1 (Buy), 0 (Hold) and −1 (Sell).
  formula: "(buys − sells) ÷ number of ratings"
target_dispersion:
  label: Target dispersion
  definition: Spread of active analyst targets relative to their average. High dispersion means analysts disagree.
  formula: (highest − lowest active target) ÷ mean active target
  plain: How much analysts disagree about where the price is going.
n_active_targets:
  label: Active targets
  definition: Number of analysts (or firms) with a price target newer than the stale cutoff.
target_high:
  label: Highest active target
  definition: Highest price target among active (non-stale) analyst targets.
target_low:
  label: Lowest active target
  definition: Lowest price target among active (non-stale) analyst targets.
analyst_trust_score:
  label: Analyst Trust Score
  definition: >-
    0–100 score of an analyst's (or firm's) scored record: how often targets were reached within 12 months (30%),
    mean absolute error at 12 months (25%), excess return of Buy/Sell calls vs. the market and sector fund at 3, 6 and
    12 months (35%), and always-bullish bias (10%). Recent calls count more, and small samples are shrunk toward
    broader records and the average analyst so a short lucky streak cannot outrank a long good record.
  plain: How well this analyst's past calls actually worked out, adjusted for how many calls there are to judge.

# ---- News and sentiment (M6) ----
news_sentiment_30d:
  label: News sentiment (30 days)
  definition: >-
    Weighted average sentiment (−1 to +1) of distinct news stories about the company in the last 30 days. Each story
    is weighted by relevance to the company, materiality (low 0.4, medium 1, high 2), source reliability and how many
    outlets covered it. Stories flagged as possible manipulation get zero weight. Sentiment comes from the LLM when
    configured, otherwise from keyword rules on the headline.
  formula: "Σ wᵢ sᵢ ÷ Σ wᵢ; wᵢ = relevance × materiality × reliability × (1 + 0.25 ln outlets)"
  plain: Whether recent news about the company has been good or bad, counting important, reliable stories more.
news_sentiment_7d:
  label: News sentiment (7 days)
  definition: The same weighted news sentiment over the last 7 days. Compared with days 8–30 to label the trend.
  formula: "Σ wᵢ sᵢ ÷ Σ wᵢ over the last 7 days"
news_stories_30d:
  label: Stories (30 days)
  definition: Number of distinct stories (after merging duplicates across outlets) with non-zero weight in the last 30 days.

# ---- Earnings (M7) ----
eps_beat_rate:
  label: EPS beat rate
  definition: Share of the last 12 reported quarters in which adjusted EPS exceeded the consensus estimate.
  formula: quarters with actual > estimate ÷ quarters with both
  plain: How often the company beat what analysts expected.
revenue_beat_rate:
  label: Revenue beat rate
  definition: Share of the last 12 reported quarters in which revenue exceeded the consensus estimate.
avg_eps_surprise:
  label: Typical EPS surprise
  definition: Median of (actual − estimate) ÷ |estimate| over the last 12 reported quarters.
  formula: median((actual − estimate) ÷ |estimate|)
avg_earnings_move:
  label: Average move after earnings
  definition: >-
    Mean absolute total return of the stock over the first session that could react to the report (the report day
    for before-open reports, the next session for after-close reports; both when the timing is not reported).
  plain: How much the stock usually jumps, up or down, when results come out.
post_earnings_drift_beats:
  label: Drift after beats
  definition: >-
    Average excess return over the market in the 20 sessions after reports that beat the EPS estimate. Persistent
    positive drift after beats is a known market anomaly; small samples are noisy.
  formula: mean(stock return − market return) over 20 sessions after beats
post_earnings_drift_misses:
  label: Drift after misses
  definition: Average excess return over the market in the 20 sessions after reports that missed the EPS estimate.
next_earnings_date:
  label: Next earnings date
  definition: The next scheduled earnings report date from the earnings calendar. Not available in point-in-time mode.

# ---- Dividends (M7) ----
dps_ttm:
  label: Dividends per share (trailing 12 months)
  definition: Sum of dividends per share with ex-dividend dates in the last 12 months, in today's share units.
dividend_yield_5y_avg:
  label: 5-year average yield
  definition: Mean of month-end trailing-12-month dividend yields over the last five years.
dividend_yield_percentile:
  label: Yield vs. own history
  definition: >-
    Share of month-ends in the last five years with a yield at or below today's. High values mean the stock yields
    more than usual (cheaper on this measure, or the market doubts the dividend).
sector_dividend_yield:
  label: Peer median yield
  definition: Median of peers' calendar-year dividends paid (SEC frames) ÷ current market cap, among dividend-paying peers.
payout_ratio_ffo:
  label: Payout ratio (FFO)
  definition: For REITs, trailing-12-month dividends paid ÷ funds from operations (net income + depreciation − gains on property sales).
  formula: dividends paid ÷ FFO
payout_ratio_fcf:
  label: Payout ratio (free cash flow)
  definition: Trailing-12-month dividends paid ÷ free cash flow (operating cash flow − capex).
  formula: dividends paid ÷ FCF
  plain: How much of the cash the business generates goes out as dividends.
dividend_growth_streak:
  label: Consecutive years of increases
  definition: Number of consecutive complete calendar years in which dividends per share rose.
dividend_cagr_5y:
  label: Dividend growth (5-year CAGR)
  definition: Compound annual growth of calendar-year dividends per share over the last five complete years.
  formula: (DPS_last ÷ DPS_5y_ago)^(1/5) − 1
dividend_cagr_10y:
  label: Dividend growth (10-year CAGR)
  definition: Compound annual growth of calendar-year dividends per share over the last ten complete years.
dividend_safety:
  label: Dividend safety score
  definition: >-
    0–100 composite of earnings payout, free-cash-flow payout, leverage (net debt ÷ EBITDA), earnings stability and
    the growth streak, each scored between configured anchors, with profile-specific anchors for utilities and REITs.
    70+ Safe, 45–70 Moderate, below 45 At risk. A model score, not a forecast.
  plain: How comfortably the company can keep paying its dividend.

# ---- Ownership (M7) ----
insider_buying_6m:
  label: Insider open-market purchases (6 months)
  definition: Dollar value of Form 4 open-market purchases (code P) by officers, directors and 10% owners in the last 6 months.
  plain: Insiders buying with their own money, the strongest insider signal.
insider_selling_6m:
  label: Insider open-market sales (6 months)
  definition: >-
    Dollar value of Form 4 open-market sales (code S) in the last 6 months. Sales under pre-arranged 10b5-1 plans are
    a weak signal; the note shows their share.
insider_clusters:
  label: Insider cluster buys (24 months)
  definition: Windows of 30 days in which at least 3 different insiders bought shares on the open market.
share_count_change_3y:
  label: Share count change (3-year CAGR)
  definition: Compound annual change in diluted weighted-average shares over three fiscal years. Negative means net buybacks.
buyback_yield:
  label: Buyback yield (trailing 12 months)
  definition: Cash spent on share repurchases in the last 12 months ÷ current market cap.
buyback_return:
  label: Value of past buybacks vs. cash spent
  definition: >-
    For each of the last six fiscal years, repurchase cash is converted to shares at that year's average closing
    price; the result compares those shares' value today with the cash spent. Positive means buybacks were made
    below today's price.
  formula: Σ (cashᵧ ÷ avg priceᵧ) × price today ÷ Σ cashᵧ − 1
payout_ratio:
  label: Payout ratio (earnings)
  definition: Trailing-12-month dividends paid ÷ net income.
  formula: dividends paid ÷ net income
  plain: How much of the profit is paid out as dividends.
short_interest_pct_float:
  label: Short interest (% of float)
  definition: >-
    Shares sold short at the latest FINRA settlement date (published about 8 business days later, so point-in-time
    mode waits for it) ÷ free-float shares (shares outstanding when the float is unavailable).
  plain: How many investors are betting the price will fall.
days_to_cover:
  label: Days to cover
  definition: Short interest ÷ average daily volume. How many days of normal trading it would take shorts to buy back.
